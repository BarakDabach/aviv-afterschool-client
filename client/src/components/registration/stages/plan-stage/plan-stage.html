<section class="relative z-[1] mx-auto mt-[var(--app-section-margin)] grid w-[min(100%,var(--app-content-width))] gap-[var(--app-section-gap)]">
  <article class="border border-border rounded-[var(--app-card-radius)] bg-[color-mix(in_oklch,var(--card)_84%,transparent)] grid min-h-[var(--app-card-min-height)] items-center gap-[var(--app-card-gap)] bg-[radial-gradient(circle_at_44%_48%,color-mix(in_oklch,var(--surface-sage)_22%,transparent),transparent_8rem),color-mix(in_oklch,var(--card)_76%,var(--surface-warm))] px-[var(--app-card-padding-x)] py-[var(--app-card-padding-y)] [&_h2]:m-0 [&_h2]:mb-[0.45rem] [&_h2]:text-[length:var(--app-card-title-size)] [&_h2]:font-extrabold [&_h2]:text-brand [&_p]:m-0 [&_p]:text-[length:var(--app-muted-size)] [&_p]:leading-[1.55] [&_p]:text-[color-mix(in_oklch,var(--foreground)_78%,white)] [&>ng-icon]:h-[var(--app-icon-xl)] [&>ng-icon]:w-[var(--app-icon-xl)] [&>ng-icon]:text-brand grid-cols-[1fr_auto]">
    <ng-icon name="lucideCalendarClock" />
    <div>
      <h2>בחירת מסלול</h2>
      <p>בחרו את הימים והשעות עבור אורי. אפשר לעדכן את הבחירה לפני שליחה.</p>
    </div>
  </article>

  <hlm-radio-group class="grid gap-[var(--app-card-gap)]" aria-label="בחירת מסלול" [value]="store.selectedPlan()" (valueChange)="store.setSelectedPlan($event)">
    <hlm-radio class="border border-border rounded-[var(--app-card-radius)] bg-[color-mix(in_oklch,var(--card)_84%,transparent)] grid min-h-[4.18rem] cursor-pointer grid-cols-[auto_minmax(0,1fr)_minmax(4.9rem,auto)] items-center gap-[var(--app-card-gap)] rounded-[var(--app-control-radius)] px-[var(--app-card-padding-x)] py-[var(--app-card-padding-y)] transition-[border-color,box-shadow,background] duration-150" [ngClass]="{ 'border-brand bg-[color-mix(in_oklch,var(--surface-sage)_36%,white)] shadow-[inset_0_0_0_1px_color-mix(in_oklch,var(--brand)_22%,transparent)]': store.isFullPlan() }" [value]="registrationPlanId.Full" (click)="store.setSelectedPlan(registrationPlanId.Full)">
      <app-selection-mark [selected]="store.isFullPlan()" />
      <span class="grid min-w-0 gap-[0.15rem] [&_strong]:text-[length:var(--app-card-title-size)] [&_strong]:font-extrabold [&_strong]:text-brand [&_small]:text-[0.72rem] [&_small]:not-italic [&_small]:leading-[1.35] [&_small]:text-[color-mix(in_oklch,var(--foreground)_70%,white)]">
        <strong>מסלול מלא</strong>
        <small>ימים א׳-ה׳ · עד 16:30</small>
      </span>
      <span class="grid min-w-[4.9rem] gap-[0.15rem] text-start [&_strong]:text-base [&_strong]:font-extrabold [&_strong]:text-brand [&_small]:text-[0.72rem] [&_small]:leading-[1.35] [&_small]:text-[color-mix(in_oklch,var(--foreground)_70%,white)]">
        <strong>₪1,450</strong>
        <small>לחודש</small>
      </span>
    </hlm-radio>

    <hlm-radio class="border border-border rounded-[var(--app-card-radius)] bg-[color-mix(in_oklch,var(--card)_84%,transparent)] grid min-h-[4.18rem] cursor-pointer grid-cols-[auto_minmax(0,1fr)_minmax(4.9rem,auto)] items-center gap-[var(--app-card-gap)] rounded-[var(--app-control-radius)] px-[var(--app-card-padding-x)] py-[var(--app-card-padding-y)] transition-[border-color,box-shadow,background] duration-150" [ngClass]="{ 'border-brand bg-[color-mix(in_oklch,var(--surface-sage)_36%,white)] shadow-[inset_0_0_0_1px_color-mix(in_oklch,var(--brand)_22%,transparent)]': store.isThreePlan() }" [value]="registrationPlanId.Three" (click)="store.setSelectedPlan(registrationPlanId.Three)">
      <app-selection-mark [selected]="store.isThreePlan()" />
      <span class="grid min-w-0 gap-[0.15rem] [&_strong]:text-[length:var(--app-card-title-size)] [&_strong]:font-extrabold [&_strong]:text-brand [&_small]:text-[0.72rem] [&_small]:not-italic [&_small]:leading-[1.35] [&_small]:text-[color-mix(in_oklch,var(--foreground)_70%,white)]">
        <strong>שלושה ימים</strong>
        <small>ימים לבחירה · עד 16:30</small>
      </span>
      <span class="grid min-w-[4.9rem] gap-[0.15rem] text-start [&_strong]:text-base [&_strong]:font-extrabold [&_strong]:text-brand [&_small]:text-[0.72rem] [&_small]:leading-[1.35] [&_small]:text-[color-mix(in_oklch,var(--foreground)_70%,white)]">
        <strong>₪1,050</strong>
        <small>לחודש</small>
      </span>
    </hlm-radio>
  </hlm-radio-group>

  <article class="border border-border rounded-[var(--app-card-radius)] bg-[color-mix(in_oklch,var(--card)_84%,transparent)] flex min-h-[2.8rem] items-center gap-[0.65rem] bg-[color-mix(in_oklch,var(--surface-sage)_26%,white)] px-[0.8rem] py-[0.65rem] text-[0.76rem] leading-[1.55] text-foreground [&_ng-icon]:h-[var(--app-icon-md)] [&_ng-icon]:w-[var(--app-icon-md)] [&_ng-icon]:flex-none [&_ng-icon]:text-brand">
    <ng-icon name="lucideCheck" />
    <span>תשלום ביטוח שנתי חד-פעמי: 200 ₪ לכל ילד.</span>
  </article>
</section>
