<article class="grid min-h-[4.05rem] grid-cols-[auto_minmax(0,1fr)_auto] items-center justify-items-start gap-[var(--app-card-gap)] rounded-[var(--app-card-radius)] border border-border bg-card px-[var(--app-card-padding-x)] py-[var(--app-card-padding-y)] text-start [direction:rtl] [&_h2]:m-0 [&_h2]:text-[length:var(--app-button-size)] [&_h2]:font-extrabold [&_h2]:text-brand [&_p]:m-0 [&_p]:mt-1 [&_p]:text-[length:var(--app-muted-size)] [&_p]:text-[color-mix(in_oklch,var(--foreground)_78%,white)] [&>div]:min-w-0">
  <span class="grid h-[var(--app-icon-lg)] w-[var(--app-icon-lg)] place-items-center rounded-full bg-brand text-brand-foreground">
    <ng-icon [name]="iconName" class="h-[var(--app-icon-md)] w-[var(--app-icon-md)]" />
  </span>
  <div>
    <h2>{{ title }}</h2>
    <p>{{ description }}</p>
  </div>
  @if (showAction) {
    <button hlmBtn variant="ghost" type="button" class="h-10 min-w-10 justify-self-end gap-2 px-2 text-brand [&_ng-icon]:h-4 [&_ng-icon]:w-4" [attr.aria-label]="actionAriaLabel || actionLabel" (click)="actionClicked.emit()">
      @if (actionIconName) {
        <ng-icon [name]="actionIconName" />
      }
      @if (actionLabel) {
        <span>{{ actionLabel }}</span>
      }
    </button>
  }
</article>
