<article class="grid min-h-[4.05rem] grid-cols-[auto_minmax(0,1fr)] items-center justify-items-start gap-[var(--app-card-gap)] rounded-[var(--app-card-radius)] border border-border bg-card px-[var(--app-card-padding-x)] py-[var(--app-card-padding-y)] text-start [direction:rtl] [&_h2]:m-0 [&_h2]:text-[length:var(--app-button-size)] [&_h2]:font-extrabold [&_h2]:text-brand [&_p]:m-0 [&_p]:mt-1 [&_p]:text-[length:var(--app-muted-size)] [&_p]:text-[color-mix(in_oklch,var(--foreground)_78%,white)] [&>div]:min-w-0 [&>ng-icon]:grid [&>ng-icon]:h-[var(--app-icon-lg)] [&>ng-icon]:w-[var(--app-icon-lg)] [&>ng-icon]:place-items-center [&>ng-icon]:rounded-full [&>ng-icon]:bg-brand [&>ng-icon]:p-[0.38rem] [&>ng-icon]:text-brand-foreground">
  <ng-icon [name]="iconName" />
  <div>
    <h2>{{ title }}</h2>
    <p>{{ description }}</p>
  </div>
</article>
