<article class="grid min-h-[4.05rem] grid-cols-[auto_minmax(0,1fr)] items-center justify-items-start gap-[var(--app-card-gap)] rounded-[var(--app-card-radius)] border border-border bg-card px-[var(--app-card-padding-x)] py-[var(--app-card-padding-y)] text-start [direction:rtl] [&_h2]:m-0 [&_h2]:text-[length:var(--app-button-size)] [&_h2]:font-extrabold [&_h2]:text-brand [&_p]:m-0 [&_p]:mt-1 [&_p]:text-[length:var(--app-muted-size)] [&_p]:text-[color-mix(in_oklch,var(--foreground)_78%,white)] [&>div]:min-w-0">
  <span class="grid h-[var(--app-icon-lg)] w-[var(--app-icon-lg)] place-items-center rounded-full bg-brand text-brand-foreground">
    <ng-icon [name]="iconName" class="h-[var(--app-icon-md)] w-[var(--app-icon-md)]" />
  </span>
  <div>
    <h2>{{ title }}</h2>
    <p>{{ description }}</p>
  </div>
</article>
